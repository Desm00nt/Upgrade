
name: Build Kustik

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew -p core test --no-daemon

      - name: Build Forge mod
        run: ./gradlew build --no-daemon

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: kustik-minecraft-1.20.1-forge
          path: build/libs/kustik-1.20.1-*.jar
          if-no-files-found: error
