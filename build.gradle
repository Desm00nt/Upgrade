plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.36'
}

group = 'io.github.desm00nt.kustik'
version = mod_version
base.archivesName = "kustik-${minecraft_version}"
evaluationDependsOn(':core')
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                kustik {
                    source sourceSets.main
                    source project(':core').sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories { mavenCentral() }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':core')
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    inputs.property 'forge_version', project.forge_version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version, forge_version: project.forge_version
    }
}

tasks.named('jar', Jar).configure {
    // Core is bundled as classes, not as a second mod or a shaded Gson copy.
    from project(':core').sourceSets.main.output
    from('LICENSE') { rename { 'LICENSE-kustik' } }
    manifest {
        attributes 'Implementation-Title': 'Kustik',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Desm00nt'
    }
    finalizedBy 'reobfJar'
}

// Validate the actual installable JAR after reobfuscation, not only processResources output.
tasks.register('verifyModJar') {
    dependsOn 'reobfJar'
    doLast {
        def modJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        new java.util.zip.ZipFile(modJar).withCloseable { archive ->
            ['META-INF/mods.toml', 'kustik/bush-system.txt',
             'io/github/desm00nt/kustik/KustikMod.class',
             'io/github/desm00nt/kustik/core/ApiKeyManager.class'].each { path ->
                if (archive.getEntry(path) == null) {
                    throw new GradleException("Missing mod content: ${path}")
                }
            }
            def descriptor = archive.getInputStream(archive.getEntry('META-INF/mods.toml'))
                    .withCloseable { it.getText('UTF-8') }
            def forgeDependency = descriptor.split(/\[\[dependencies\.kustik\]\]/)
                    .find { it.contains('modId="forge"') }
            if (!forgeDependency?.contains("versionRange=\"[${project.forge_version},48)\"")
                    || !descriptor.contains("version=\"${project.version}\"") || descriptor.contains('${')) {
                throw new GradleException('Packaged mod version or Forge requirement does not match the build')
            }
        }
        def checksum = java.security.MessageDigest.getInstance('SHA-256').digest(modJar.bytes).encodeHex().toString()
        logger.lifecycle("Verified ${modJar.name}: Forge [${project.forge_version},48); SHA-256 ${checksum}")
        if (System.getenv('GITHUB_ACTIONS') == 'true') {
            // A public CI notice exposes only the artifact identity, never any runtime configuration or keys.
            println "::notice title=Kustik JAR verified::${modJar.name}; Forge [${project.forge_version},48); SHA-256 ${checksum}"
        }
    }
}

tasks.named('build').configure { dependsOn 'verifyModJar' }
tasks.named('check').configure { dependsOn ':core:test' }
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
